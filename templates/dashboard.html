<!DOCTYPE html>
<html>
<head>
    <title>SPION Security Dashboard</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0a0c10;
            color: #e5e7eb;
        }

        /* TOP BAR */
        .topbar {
            background: #111827;
            padding: 12px 20px;
            border-bottom: 1px solid #1f2937;
        }

        .title {
            font-size: 16px;
            font-weight: bold;
            color: #38bdf8;
        }

        /* SIMPLE GRID */
        .container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            padding: 15px;
        }

        /* CARDS */
        .card {
            background: #111827;
            padding: 12px;
            border: 1px solid #1f2937;
            border-radius: 6px;
        }

        h3 {
            margin-top: 0;
            font-size: 13px;
            color: #9ca3af;
        }

        /* RISK */
        .risk {
            font-size: 24px;
            font-weight: bold;
        }

        .low { color: #22c55e; }
        .medium { color: #f59e0b; }
        .high { color: #ef4444; }

        /* EVENTS */
        .event {
            padding: 8px;
            margin-bottom: 8px;
            background: #0f172a;
            border-left: 3px solid #334155;
            font-size: 12px;
        }

        .FAILED_LOGIN {
            border-left-color: #f59e0b;
        }

        .INTRUDER_DETECTED {
            border-left-color: #ef4444;
        }

        .SUCCESS_LOGIN {
            border-left-color: #22c55e;
        }

        .time {
            font-size: 10px;
            opacity: 0.6;
        }

        /* RIGHT ALERT BOX */
        .alert {
            background: #0f172a;
            padding: 10px;
            border-radius: 6px;
            font-size: 12px;
            border: 1px solid #1f2937;
        }
    </style>
</head>

<body>

<div class="topbar">
    <div class="title"> SPION Dashboard</div>
</div>

<div class="container">

    <!-- RISK -->
    <div class="card">
        <h3>Risk Level</h3>
        <div id="risk" class="risk low">LOW</div>
    </div>

    <!-- STATUS -->
    <div class="card">
        <h3>Status</h3>
        <div class="alert">
            Monitoring active...<br>
            Auth logs: running<br>
            Camera: standby
        </div>
    </div>

    <!-- EVENTS -->
    <div class="card" style="grid-column: span 2;">
        <h3>Events</h3>
        <div id="events"></div>
    </div>

</div>

<script>
function loadData() {
    fetch("/api/events")
    .then(res => res.json())
    .then(data => {

        document.getElementById("risk").innerText = data.risk;
        document.getElementById("risk").className = "risk " + data.risk.toLowerCase();

        let html = "";

        data.events.forEach(e => {
            let type = e[1];
            let msg = e[2];
            let time = e[3];

            html += `
                <div class="event ${type}">
                    <b>${type}</b><br>
                    ${msg}<br>
                    <span class="time">${time}</span>
                </div>
            `;
        });

        document.getElementById("events").innerHTML = html;
    });
}

setInterval(loadData, 2000);
loadData();
</script>

</body>
</html>
