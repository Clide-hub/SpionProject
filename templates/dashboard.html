<!DOCTYPE html>
<html>
<head>
    <title>SPION Dashboard</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0b0f14;
            color: #e5e7eb;
            display: flex;
        }

        /* SIDEBAR */
        .sidebar {
            width: 120px;
            background: #111827;
            padding: 12px 20px;
            border-bottom: 1px solid #1f2937;
        }

        .title {
            font-size: 16px;
            font-weight: bold;
            color: #38bdf8;
        }

        /* MAIN */
        .main {
            flex: 1;
            padding: 20px;
        }

        /* HEADER */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* GRID */
        .grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-top: 20px;
        }

        .card {
            background: #111827;
            padding: 15px;
            border-radius: 10px;
            border: 1px solid #1f2937;
        }

        .card h3 {
            font-size: 12px;
            color: #9ca3af;
        }

        .big {
            font-size: 26px;
            font-weight: bold;
        }

        .low { color: #22c55e; }
        .medium { color: #f59e0b; }
        .high { color: #ef4444; }

        /* EVENTS */
        .event {
            padding: 10px;
            margin-bottom: 10px;
            background: #0f172a;
            border-left: 4px solid #334155;
            border-radius: 6px;
        }

        .FAILED_LOGIN { border-left-color: #f59e0b; }
        .INTRUDER_DETECTED { border-left-color: #ef4444; }
        .SUCCESS_LOGIN { border-left-color: #22c55e; }

        .time {
            font-size: 11px;
            opacity: 0.6;
        }

        /* EXTRA SECTIONS */
        .section {
            margin-top: 20px;
        }

        .image-box img {
            width: 50%;
            border-radius: 4px;
        }

        .alert-box {
            background: #0f172a;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #1f2937;
            font-size: 12px;
        }

    </style>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">
    <div class="menu active">📊 Dashboard</div>
    <div class="menu">🖥 Site Management</div>
    <div class="menu">⚙️ Settings</div>
</div>

<!-- MAIN -->
<div class="main">

    <!-- HEADER -->
    <div class="header">
        <h2>SPION DASHBOARD</h2>
        <div>HELLO, ZAIN</div>
    </div>

    <!-- TOP STATS -->
    <div class="grid">

        <div class="card">
            <h3>Risk Level</h3>
            <div id="risk" class="big low">LOW</div>
        </div>

        <div class="card">
            <h3>Failed Logins</h3>
            <div id="failed" class="big">0</div>
        </div>

        <div class="card">
            <h3>Intrusions</h3>
            <div id="intrusions" class="big">0</div>
        </div>

        <div class="card">
            <h3>Status</h3>
            <div class="big">ACTIVE</div>
        </div>

    </div>

    <!-- RISK EXPLANATION -->
    <div class="section card">
        <h3>Risk Analysis</h3>
        <div id="riskReason" class="alert-box">
            System operating normally.
        </div>
    </div>

    <!-- INTRUDER IMAGE -->
    <div class="section card">
        <h3>Intruder Capture</h3>
        <div class="image-box">
            <img id="intruderImg" src="" alt="No Image Available">
        </div>
    </div>

    <!-- SYSTEM RESPONSE -->
    <div class="section card">
        <h3>System Response Log</h3>
        <div id="responses" class="alert-box">
            No actions taken.
        </div>
    </div>

    <!-- EVENTS -->
    <div class="section">
        <h3>Recent Activity</h3>
        <div id="events"></div>
    </div>

</div>

<script>
function loadData() {

    // ✅ Dummy Data (for now)
    let data = {
        risk: "HIGH",
        events: [
            [1, "FAILED_LOGIN", "Wrong password entered", "10:30 AM"],
            [2, "FAILED_LOGIN", "Wrong password entered", "10:31 AM"],
            [3, "INTRUDER_DETECTED", "Intruder detected - photo captured", "10:32 AM"],
            [4, "SUCCESS_LOGIN", "Unauthorized login detected", "10:33 AM"]
        ]
    };

        document.getElementById("risk").innerText = data.risk;
        document.getElementById("risk").className = "risk " + data.risk.toLowerCase();

        let html = "";

        data.events.forEach(e => {
            let type = e[1];
            let msg = e[2];
            let time = e[3];

        html += `
            <div class="event ${type}">
                <b>${type}</b><br>
                ${msg}<br>
                <span class="time">${time}</span>
            </div>
        `;
    });

        document.getElementById("events").innerHTML = html;
    };


setInterval(loadData, 2000);
loadData();
</script>

</body>
</html>
