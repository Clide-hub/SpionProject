<!DOCTYPE html>
<html>
<head>
    <title>SPION Dashboard</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0b0f14;
            color: #e5e7eb;
            display: flex;
        }

        .sidebar {
            width: 120px;
            background: #111827;
            height: 100vh;
            padding-top: 20px;
            border-right: 1px solid #1f2937;
        }

        .menu {
            padding: 12px;
            font-size: 12px;
            text-align: center;
            color: #9ca3af;
            margin-bottom: 15px;
        }

        .menu:hover {
            background: #1f2937;
            color: white;
        }

        .active {
            background: #1f2937;
            color: #38bdf8;
        }

        .main {
            flex: 1;
            padding: 20px;
        }

        .header {
            display: flex;
            justify-content: space-between;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-top: 20px;
        }

        .card {
            background: #111827;
            padding: 15px;
            border-radius: 10px;
            border: 1px solid #1f2937;
        }

        .big {
            font-size: 26px;
            font-weight: bold;
        }

        .low { color: #22c55e; }
        .medium { color: #f59e0b; }
        .high { color: #ef4444; }

        .section {
            margin-top: 20px;
        }

        .event {
            padding: 10px;
            margin-bottom: 10px;
            background: #0f172a;
            border-left: 4px solid #334155;
        }

        .FAILED_LOGIN { border-left-color: #f59e0b; }
        .INTRUDER_DETECTED { border-left-color: #ef4444; }
        .SUCCESS_LOGIN { border-left-color: #22c55e; }

        .time {
            font-size: 11px;
            opacity: 0.6;
        }

        .alert-box {
            background: #0f172a;
            padding: 10px;
            border-radius: 8px;
            font-size: 12px;
        }

        img {
            width: 50%;
            border-radius: 6px;
        }
    </style>
</head>

<body>

<div class="sidebar">
    <div class="menu active">📊 Dashboard</div>
    <div class="menu">🖥 Site</div>
    <div class="menu">⚙️ Settings</div>
</div>

<div class="main">

    <div class="header">
        <h2>SPION DASHBOARD</h2>
        <div>HELLO, ZAIN</div>
    </div>

    <div class="grid">
        <div class="card">
            <h3>Risk</h3>
            <div id="risk" class="big low">LOW</div>
        </div>

        <div class="card">
            <h3>Failed</h3>
            <div id="failed" class="big">0</div>
        </div>

        <div class="card">
            <h3>Intrusions</h3>
            <div id="intrusions" class="big">0</div>
        </div>

        <div class="card">
            <h3>Status</h3>
            <div class="big">ACTIVE</div>
        </div>
    </div>

    <div class="section card">
        <h3>Risk Analysis</h3>
        <div id="riskReason" class="alert-box">System normal</div>
    </div>

    <div class="section card">
        <h3>Intruder Capture</h3>
        <img id="intruderImg" src="">
    </div>

    <div class="section card">
        <h3>System Response</h3>
        <div id="responses" class="alert-box">None</div>
    </div>

    <div class="section">
        <h3>Events</h3>
        <div id="events"></div>
    </div>

</div>

<script>
function loadData() {
    fetch("/api/events")
    .then(res => res.json())
    .then(data => {

        document.getElementById("risk").innerText = data.risk;
        document.getElementById("risk").className = "big " + data.risk.toLowerCase();

        let failed = 0;
        let intrusions = 0;
        let reasons = [];
        let responses = "";
        let html = "";

        data.events.forEach(e => {
            let type = e[1];
            let msg = e[2];
            let time = e[3];

            if (type === "FAILED_LOGIN") failed++;
            if (type === "INTRUDER_DETECTED") intrusions++;

            html += `
                <div class="event ${type}">
                    <b>${type}</b><br>
                    ${msg}<br>
                    <span class="time">${time}</span>
                </div>
            `;
        });

        document.getElementById("events").innerHTML = html;
        document.getElementById("failed").innerText = failed;
        document.getElementById("intrusions").innerText = intrusions;

        // 🔥 IMAGE (REAL-TIME)
        if (data.image) {
            document.getElementById("intruderImg").src =
                data.image + "?t=" + new Date().getTime();
        }
    });
}

setInterval(loadData, 2000);
loadData();
</script>

</body>
</html>
